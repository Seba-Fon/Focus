<!DOCTYPE html>
<html lang="esp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>
    <section class="tareas">
        <div class="header-tareas"> 
            <h2>Tareas</h2>
            <button class="agregar-tarea" type="button">+</button>
            <ul class="lista-tareas"></ul>
        </div>
        
        <div class="modal-tarea"> <!--Modal para input de tareas-->
            <input class="nombre-tarea" type="text" placeholder="Ingrese la tarea">
            <div class="modal-botones">
                <button class="guardar" type="button">Guardar</button>
                <button class="cancelar" type="button">Cancelar</button>
            </div>
            
        </div>
        
    </section>

    <script type="module" src="JS/app.js"></script>
</body>

</html>
